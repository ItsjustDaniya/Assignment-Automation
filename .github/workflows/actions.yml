
name: Run Assignment-Automation Pipeline

on:
  schedule:
    - cron: '30 2 * * *'    # 8:00 AM IST
    - cron: '30 10 * * *'   # 4:00 PM IST
  workflow_dispatch:

concurrency:
  group: assignment-automation-pipeline
  cancel-in-progress: false

jobs:
  run-data-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version

      - name: Execute Assignment-Automation.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          METABASE_URL: ${{ secrets.METABASE_URL }}

        run: |
          echo "=============================="
          echo "Workflow triggered at UTC: $(date -u)"
          echo "Current branch: $GITHUB_REF"
          echo "Repository path: $GITHUB_WORKSPACE"
          echo "=============================="

          echo "Starting Assignment-Automation.py..."

          python Assignment-Automation.py

          echo "Assignment automation completed successfully."
