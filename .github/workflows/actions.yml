name: Run Assignment-Automation Pipeline

on:
  schedule:
    - cron: '30 2 * * *'    # 8:00 AM IST (2:30 UTC)
    - cron: '30 9 * * *'   # 4:00 PM IST (12:30 UTC)
  workflow_dispatch:

concurrency:
  group: assignment-automation-pipeline
  cancel-in-progress: false

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Assignment-Automation.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          METABASE_URL: ${{ secrets.METABASE_URL }}


        run: |
          echo "=============================="
          echo "Workflow triggered at UTC: $(date -u)"
          echo "Current branch: $GITHUB_REF"
          echo "Repository path: $GITHUB_WORKSPACE"
          echo "=============================="
          echo "🚀 Starting Assignment-Automation.py..."
          echo "Using Metabase URL: ${METABASE_URL:0:25}****"
          echo "Using USERNAME variable: ${USERNAME:+[SET]}"

          python Assignment-Automation.py

          echo "✅ Assignment_Pipeline_Automation.py executed successfully."
